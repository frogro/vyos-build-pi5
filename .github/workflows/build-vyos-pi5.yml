name: Build VyOS Raspberry Pi Image (Pinned Rolling + Armbian)
run-name: RPi ${{ inputs.vyos_version }} @ ${{ inputs.vyos_ref }}

on:
  workflow_dispatch:
    inputs:
      vyos_ref:
        description: "Exact vyos/vyos-build commit"
        required: true
        type: string
      vyos_version:
        description: "Official VyOS rolling version"
        required: true
        type: string
      expected_frr_version:
        description: "Expected FRR version from official ISO"
        required: false
        default: ""
        type: string
      expected_podman_version:
        description: "Expected Podman version from official ISO"
        required: false
        default: ""
        type: string
      expected_vyos1x_version:
        description: "Expected vyos-1x version from official ISO"
        required: false
        default: ""
        type: string
      upstream_run_id:
        description: "Parent auto-nightly run containing the official package lock artifact"
        required: false
        default: ""
        type: string
      expected_package_lock_sha256:
        description: "SHA-256 of the complete official amd64 package lock"
        required: false
        default: ""
        type: string

permissions:
  contents: read
  actions: read

jobs:
  build-image:
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout Raspberry Pi build repository
        uses: actions/checkout@v6
        with:
          path: repo

      - name: Checkout exact VyOS source
        uses: actions/checkout@v6
        with:
          repository: vyos/vyos-build
          ref: ${{ inputs.vyos_ref }}
          path: vyos-build

      - name: Download official VyOS nightly package lock
        if: inputs.upstream_run_id != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_RUN_ID: ${{ inputs.upstream_run_id }}
          EXPECTED_LOCK_SHA256: ${{ inputs.expected_package_lock_sha256 }}
        run: |
          set -euo pipefail
          mkdir -p nightly-lock

          ok=false
          for _ in $(seq 1 12); do
            if gh run download "$UPSTREAM_RUN_ID" \
                 --repo "$GITHUB_REPOSITORY" \
                 --name "vyos-nightly-lock-${UPSTREAM_RUN_ID}" \
                 --dir nightly-lock; then
              ok=true
              break
            fi
            sleep 5
          done
          [ "$ok" = true ]

          test -s nightly-lock/official-package-lock.tsv
          ACTUAL_LOCK_SHA256="$(sha256sum nightly-lock/official-package-lock.tsv | awk '{print $1}')"
          if [ -n "$EXPECTED_LOCK_SHA256" ]; then
            test "$ACTUAL_LOCK_SHA256" = "$EXPECTED_LOCK_SHA256"
          fi
          echo "Official package lock SHA-256: $ACTUAL_LOCK_SHA256"
          echo "OFFICIAL_PACKAGE_LOCK=$GITHUB_WORKSPACE/nightly-lock/official-package-lock.tsv" >> "$GITHUB_ENV"
          echo "OFFICIAL_PACKAGE_LOCK_SHA256=$ACTUAL_LOCK_SHA256" >> "$GITHUB_ENV"

      - name: Install required tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            7zip \
            7zip-standalone \
            squashfs-tools \
            xz-utils \
            rsync \
            util-linux \
            parted \
            e2fsprogs \
            dosfstools \
            zstd \
            curl \
            jq \
            git \
            dpkg-dev \
            python3

      - name: Validate Raspberry Pi repository
        run: |
          set -euo pipefail
          cd repo
          ./scripts/pi5/validate-prebuild.sh

      - name: Build VyOS build image (native ARM64)
        run: |
          set -euo pipefail
          cd vyos-build/docker
          docker build -t vyos-build:rolling-arm64 .

      - name: Rebuild pinned VyOS core userspace package set
        if: inputs.expected_vyos1x_version != ''
        shell: bash
        env:
          EXPECTED_VYOS1X: ${{ inputs.expected_vyos1x_version }}
        run: |
          set -euo pipefail

          if [[ ! "$EXPECTED_VYOS1X" =~ -g([0-9a-f]{7,40})$ ]]; then
            echo "ERROR: cannot derive vyos-1x source commit from version: $EXPECTED_VYOS1X" >&2
            exit 1
          fi
          COMMIT_HINT="${BASH_REMATCH[1]}"

          rm -rf pinned-vyos-1x-src
          git clone --recurse-submodules https://github.com/vyos/vyos-1x.git pinned-vyos-1x-src
          git -C pinned-vyos-1x-src checkout --detach "$COMMIT_HINT"
          git -C pinned-vyos-1x-src submodule update --init --recursive

          RESOLVED_COMMIT="$(git -C pinned-vyos-1x-src rev-parse HEAD)"
          [[ "$RESOLVED_COMMIT" == "$COMMIT_HINT"* ]]
          echo "Pinned vyos-1x source commit: $RESOLVED_COMMIT"

          mkdir -p vyos-build/packages
          rm -f vyos-build/packages/vyos-1x_*.deb \
                vyos-build/packages/vyos-user-utils_*.deb \
                vyos-build/packages/vyos-1x-vmware_*.deb

          docker run --rm --privileged \
            --network host \
            -e EXPECTED_VYOS1X="$EXPECTED_VYOS1X" \
            -v "$GITHUB_WORKSPACE/pinned-vyos-1x-src":/src/vyos-1x \
            -v "$GITHUB_WORKSPACE/vyos-build/packages":/out \
            vyos-build:rolling-arm64 \
            bash -lc '
              set -euo pipefail
              git config --global --add safe.directory /src/vyos-1x
              cd /src/vyos-1x
              dpkg-buildpackage -uc -us -tc -b

              copied=0
              for deb in /src/*.deb; do
                [ -f "$deb" ] || continue
                pkg="$(dpkg-deb -f "$deb" Package)"
                ver="$(dpkg-deb -f "$deb" Version)"
                arch="$(dpkg-deb -f "$deb" Architecture)"
                echo "Built package: $pkg $ver $arch"
                if [ "$ver" = "$EXPECTED_VYOS1X" ] && { [ "$arch" = arm64 ] || [ "$arch" = all ]; }; then
                  cp -v "$deb" /out/
                  copied=$((copied + 1))
                fi
              done
              test "$copied" -gt 0
            '

          FOUND_VYOS1X=false
          for deb in vyos-build/packages/*.deb; do
            [ -f "$deb" ] || continue
            pkg="$(dpkg-deb -f "$deb" Package)"
            ver="$(dpkg-deb -f "$deb" Version)"
            arch="$(dpkg-deb -f "$deb" Architecture)"
            echo "Pinned custom package: $pkg $ver $arch"
            if [ "$pkg" = vyos-1x ] && [ "$ver" = "$EXPECTED_VYOS1X" ]; then
              FOUND_VYOS1X=true
            fi
          done
          [ "$FOUND_VYOS1X" = true ]

      - name: Build pinned VyOS Rolling ARM64 release image
        run: |
          set -euo pipefail
          cd vyos-build
          docker run --rm --privileged \
            --network host \
            -v "$(pwd)":/vyos \
            -w /vyos \
            vyos-build:rolling-arm64 \
            sudo ./build-vyos-image --architecture arm64 --build-type release --version "${{ inputs.vyos_version }}" generic

      - name: Extract and pack fresh VyOS ARM64 rootfs
        id: rootfs
        shell: bash
        env:
          EXPECTED_FRR: ${{ inputs.expected_frr_version }}
          EXPECTED_PODMAN: ${{ inputs.expected_podman_version }}
          EXPECTED_VYOS1X: ${{ inputs.expected_vyos1x_version }}
        run: |
          set -euo pipefail

          ISO_FILE="$(find vyos-build/build -maxdepth 1 -type f -iname '*.iso' -print -quit)"
          test -n "$ISO_FILE"
          test -f "$ISO_FILE"

          VYOS_COMMIT="$(git -C vyos-build rev-parse HEAD)"
          ISO_NAME="$(basename "$ISO_FILE")"

          mkdir -p iso-extract vyos-rootfs-fresh

          7zz x \
            "$ISO_FILE" \
            -oiso-extract \
            live/filesystem.squashfs \
            -y

          test -f iso-extract/live/filesystem.squashfs

          sudo unsquashfs \
            -f \
            -d vyos-rootfs-fresh \
            iso-extract/live/filesystem.squashfs

          test -x vyos-rootfs-fresh/bin/bash
          test -d vyos-rootfs-fresh/usr
          test -d vyos-rootfs-fresh/etc

          VERSION_JSON="vyos-rootfs-fresh/usr/share/vyos/version.json"
          test -f "$VERSION_JSON"

          jq -e --arg v "${{ inputs.vyos_version }}" \
            '.version == $v and .architecture == "arm64" and .build_type == "release"' \
            "$VERSION_JSON"

          grep -Fx "Version: ${{ inputs.vyos_version }}" \
            vyos-rootfs-fresh/opt/vyatta/etc/version

          if [[ "${{ inputs.vyos_ref }}" =~ ^[0-9a-f]{40}$ ]]; then
            test "$VYOS_COMMIT" = "${{ inputs.vyos_ref }}"
          fi

          echo "VyOS release metadata validation: PASS"

          DPKG_ADM="$GITHUB_WORKSPACE/vyos-rootfs-fresh/var/lib/dpkg"

          FRR_VERSION="$(dpkg-query --admindir="$DPKG_ADM" -W -f='${Version}' frr)"
          PODMAN_VERSION="$(dpkg-query --admindir="$DPKG_ADM" -W -f='${Version}' podman)"
          VYOS1X_VERSION="$(dpkg-query --admindir="$DPKG_ADM" -W -f='${Version}' vyos-1x)"

          echo "FRR:     $FRR_VERSION"
          echo "Podman:  $PODMAN_VERSION"
          echo "vyos-1x: $VYOS1X_VERSION"

          dpkg-query \
            --admindir="$DPKG_ADM" \
            -W -f='${Package}\t${Version}\t${Architecture}\n' | \
            LC_ALL=C sort -u > arm64-package-lock.tsv

          if [ -n "${OFFICIAL_PACKAGE_LOCK:-}" ] && [ -s "$OFFICIAL_PACKAGE_LOCK" ]; then
            python3 - "$OFFICIAL_PACKAGE_LOCK" arm64-package-lock.tsv package-parity-report.txt <<'PY_PACKAGE_PARITY'
          from pathlib import Path
          import sys

          official_path, arm_path, report_path = map(Path, sys.argv[1:])

          def load(path):
              result = {}
              for raw in path.read_text(encoding='utf-8').splitlines():
                  if not raw.strip():
                      continue
                  name, version, arch = raw.split('\t')
                  result[name] = (version, arch)
              return result

          official = load(official_path)
          arm = load(arm_path)
          shared = sorted(set(official) & set(arm))

          # Compare the complete package intersection. Only packages that are
          # intentionally tied to the architecture/kernel/hardware stack are
          # excluded; those are replaced by the pinned Raspberry Pi base later.
          def platform_specific(name):
              return (
                  name.startswith('linux-image-')
                  or name.startswith('linux-headers-')
                  or name.startswith('linux-tools-')
                  or name.startswith('vyos-linux-')
                  or name.startswith('vyos-intel-')
              )

          checked = []
          diffs = []
          for name in shared:
              if platform_specific(name):
                  continue
              ov, oa = official[name]
              av, aa = arm[name]
              checked.append(name)
              if ov != av:
                  diffs.append((name, ov, oa, av, aa))

          lines = [
              f'official_packages={len(official)}',
              f'arm64_packages={len(arm)}',
              f'shared_packages={len(shared)}',
              f'checked_shared_packages={len(checked)}',
              f'package_version_mismatches={len(diffs)}',
          ]
          for row in diffs:
              lines.append('MISMATCH\t' + '\t'.join(row))
          report_path.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          print('\n'.join(lines))
          if diffs:
              raise SystemExit('ERROR: official Rolling vs ARM64 shared package parity mismatch')
          PY_PACKAGE_PARITY
          fi

          [ -z "$EXPECTED_FRR" ] || test "$FRR_VERSION" = "$EXPECTED_FRR"
          [ -z "$EXPECTED_PODMAN" ] || test "$PODMAN_VERSION" = "$EXPECTED_PODMAN"
          [ -z "$EXPECTED_VYOS1X" ] || test "$VYOS1X_VERSION" = "$EXPECTED_VYOS1X"

          echo "frr_version=$FRR_VERSION" >> "$GITHUB_OUTPUT"
          echo "podman_version=$PODMAN_VERSION" >> "$GITHUB_OUTPUT"
          echo "vyos1x_version=$VYOS1X_VERSION" >> "$GITHUB_OUTPUT"

          echo "VyOS package parity validation: PASS"

          sudo tar \
            --numeric-owner \
            --acls \
            --xattrs \
            --xattrs-include='*' \
            -czpf vyos-rootfs-fresh.tar.gz \
            -C vyos-rootfs-fresh .

          sudo chown "$(id -u):$(id -g)" vyos-rootfs-fresh.tar.gz

          ROOTFS_SHA="$(sha256sum vyos-rootfs-fresh.tar.gz | awk '{print $1}')"
          echo "vyos_commit=$VYOS_COMMIT" >> "$GITHUB_OUTPUT"
          echo "iso_name=$ISO_NAME" >> "$GITHUB_OUTPUT"
          echo "rootfs_sha=$ROOTFS_SHA" >> "$GITHUB_OUTPUT"

          echo "$ROOTFS_SHA  vyos-rootfs-fresh.tar.gz"

      - name: Free build space
        run: |
          set -euo pipefail
          sudo rm -rf vyos-rootfs-fresh iso-extract
          sudo rm -rf vyos-build/build
          docker image rm vyos-build:rolling-arm64 2>/dev/null || true
          docker system prune -af 2>/dev/null || true
          df -h /

      - name: Load pinned Raspberry Pi hardware base metadata
        id: base
        shell: bash
        run: |
          set -euo pipefail
          set -a
          source repo/config/pi5-armbian-base.env
          set +a

          : "${ARMBIAN_BASE_TAG:?missing ARMBIAN_BASE_TAG}"
          : "${ARMBIAN_BASE_ASSET:?missing ARMBIAN_BASE_ASSET}"
          : "${ARMBIAN_BASE_SHA256:?missing ARMBIAN_BASE_SHA256}"
          : "${ARMBIAN_KERNEL:?missing ARMBIAN_KERNEL}"

          echo "tag=$ARMBIAN_BASE_TAG" >> "$GITHUB_OUTPUT"
          echo "asset=$ARMBIAN_BASE_ASSET" >> "$GITHUB_OUTPUT"
          echo "sha256=$ARMBIAN_BASE_SHA256" >> "$GITHUB_OUTPUT"
          echo "kernel=$ARMBIAN_KERNEL" >> "$GITHUB_OUTPUT"

      - name: Download pinned Armbian Raspberry Pi hardware base
        shell: bash
        run: |
          set -euo pipefail

          BASE_DIR="$RUNNER_TEMP/armbian-base"
          mkdir -p "$BASE_DIR"

          BASE_FILE="$BASE_DIR/${{ steps.base.outputs.asset }}"
          BASE_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${{ steps.base.outputs.tag }}/${{ steps.base.outputs.asset }}"

          curl \
            --fail \
            --location \
            --retry 5 \
            --retry-delay 3 \
            --output "$BASE_FILE" \
            "$BASE_URL"

          echo "${{ steps.base.outputs.sha256 }}  $BASE_FILE" | sha256sum -c -
          xz -t "$BASE_FILE"

          echo "ARMBIAN_BASE_FILE=$BASE_FILE" >> "$GITHUB_ENV"

      - name: Merge VyOS with Raspberry Pi hardware base
        shell: bash
        run: |
          set -euo pipefail

          MERGE_DIR="$RUNNER_TEMP/pi5-merged"
          TMP_WORK="$RUNNER_TEMP/pi5-tmp"
          mkdir -p "$MERGE_DIR" "$TMP_WORK"

          sudo env \
            TMPDIR="$TMP_WORK" \
            repo/scripts/pi5/merge-vyos-pi5.sh \
            "$ARMBIAN_BASE_FILE" \
            "$GITHUB_WORKSPACE/vyos-rootfs-fresh.tar.gz" \
            "$MERGE_DIR"

          sudo chown -R "$(id -u):$(id -g)" "$MERGE_DIR"

          test -f "$MERGE_DIR/vyos-rootfs-pi5-merged.tar.gz"
          test -f "$MERGE_DIR/pi5-base-manifest.txt"

          cat "$MERGE_DIR/pi5-base-manifest.txt"

          echo "MERGED_ROOTFS=$MERGE_DIR/vyos-rootfs-pi5-merged.tar.gz" >> "$GITHUB_ENV"
          echo "PI5_BASE_MANIFEST=$MERGE_DIR/pi5-base-manifest.txt" >> "$GITHUB_ENV"

      - name: Build flashable Raspberry Pi VyOS A/B image
        shell: bash
        run: |
          set -euo pipefail

          OUT_DIR="$GITHUB_WORKSPACE/output"
          TMP_WORK="$RUNNER_TEMP/pi5-tmp"
          mkdir -p "$OUT_DIR" "$TMP_WORK"

          OUT_IMG="$OUT_DIR/vyos-${{ inputs.vyos_version }}-rpi-arm64.img"

          sudo env \
            TMPDIR="$TMP_WORK" \
            AB_IMAGE_SIZE_MIB=12360 \
            repo/scripts/pi5/build-vyos-pi5-image.sh \
            "$ARMBIAN_BASE_FILE" \
            "$MERGED_ROOTFS" \
            "$OUT_IMG"

          sudo chown "$(id -u):$(id -g)" "$OUT_IMG"

          test -f "$OUT_IMG"
          ls -lh "$OUT_IMG"

      - name: Compress Raspberry Pi A/B image
        shell: bash
        run: |
          set -euo pipefail

          OUT_IMG="$GITHUB_WORKSPACE/output/vyos-${{ inputs.vyos_version }}-rpi-arm64.img"
          test -f "$OUT_IMG"

          xz -T0 -6 "$OUT_IMG"
          xz -t "$OUT_IMG.xz"
          ls -lh "$OUT_IMG.xz"

      - name: Build matching Raspberry Pi A/B update bundle
        shell: bash
        run: |
          set -euo pipefail

          OUT_DIR="$GITHUB_WORKSPACE/output"
          TMP_WORK="$RUNNER_TEMP/pi5-tmp"
          UPDATE_BUNDLE="$OUT_DIR/vyos-${{ inputs.vyos_version }}-rpi-arm64-update.tar.zst"

          sudo env \
            TMPDIR="$TMP_WORK" \
            ZSTD_LEVEL=10 \
            repo/scripts/pi5/build-vyos-pi-ab-update.sh \
            "$ARMBIAN_BASE_FILE" \
            "$MERGED_ROOTFS" \
            "$UPDATE_BUNDLE"

          sudo chown "$(id -u):$(id -g)" "$UPDATE_BUNDLE"
          test -f "$UPDATE_BUNDLE"
          zstd -q -t "$UPDATE_BUNDLE"
          ls -lh "$UPDATE_BUNDLE"

          # The large build inputs are no longer needed after both release
          # artifacts have been produced.
          sudo rm -f "$GITHUB_WORKSPACE/vyos-rootfs-fresh.tar.gz"
          sudo rm -f "$MERGED_ROOTFS"
          sudo rm -f "$ARMBIAN_BASE_FILE"
          df -h /

      - name: Preserve VyOS nightly package parity metadata
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/output"
          test -s arm64-package-lock.tsv
          cp arm64-package-lock.tsv "$GITHUB_WORKSPACE/output/arm64-package-lock.tsv"
          if [ -n "${OFFICIAL_PACKAGE_LOCK:-}" ] && [ -s "$OFFICIAL_PACKAGE_LOCK" ]; then
            cp "$OFFICIAL_PACKAGE_LOCK" "$GITHUB_WORKSPACE/output/official-amd64-package-lock.tsv"
            test -s package-parity-report.txt
            cp package-parity-report.txt "$GITHUB_WORKSPACE/output/package-parity-report.txt"
          fi

      - name: Create Raspberry Pi A/B release metadata
        shell: bash
        run: |
          set -euo pipefail

          OUT_DIR="$GITHUB_WORKSPACE/output"
          cd "$OUT_DIR"

          IMAGE="vyos-${{ inputs.vyos_version }}-rpi-arm64.img.xz"
          UPDATE_BUNDLE="vyos-${{ inputs.vyos_version }}-rpi-arm64-update.tar.zst"

          sha256sum "$IMAGE" "$UPDATE_BUNDLE" > SHA256SUMS

          ROOTFS_SHA="${{ steps.rootfs.outputs.rootfs_sha }}"
          IMAGE_SHA="$(awk '$2 ~ /\.img\.xz$/ {print $1}' SHA256SUMS)"
          UPDATE_SHA="$(awk '$2 ~ /-update\.tar\.zst$/ {print $1}' SHA256SUMS)"
          REPO_COMMIT="$(git -C "$GITHUB_WORKSPACE/repo" rev-parse HEAD)"

          test -n "$IMAGE_SHA"
          test -n "$UPDATE_SHA"

          {
            echo "VyOS Raspberry Pi 4 / Raspberry Pi 5 A/B image build"
            echo
            echo "Raspberry Pi build repository commit:"
            echo "$REPO_COMMIT"
            echo
            echo "VyOS upstream repository:"
            echo "vyos/vyos-build"
            echo
            echo "VyOS upstream rolling commit:"
            echo "${{ steps.rootfs.outputs.vyos_commit }}"
            echo
            echo "VyOS ISO:"
            echo "${{ steps.rootfs.outputs.iso_name }}"
            echo
            echo "VyOS fresh rootfs SHA256:"
            echo "$ROOTFS_SHA"
            echo
            echo "Armbian hardware-base tag:"
            echo "${{ steps.base.outputs.tag }}"
            echo
            echo "Armbian hardware-base asset:"
            echo "${{ steps.base.outputs.asset }}"
            echo
            echo "Armbian hardware-base SHA256:"
            echo "${{ steps.base.outputs.sha256 }}"
            echo
            echo "Configured Armbian kernel:"
            echo "${{ steps.base.outputs.kernel }}"
            echo
            echo "Image layout:"
            echo "Raspberry Pi A/B: VYOS_AB + VYOS_BOOT_A/B + VYOS_ROOT_A/B"
            echo
            echo "Final image:"
            echo "$IMAGE"
            echo
            echo "Final image SHA256:"
            echo "$IMAGE_SHA"
            echo
            echo "A/B update bundle:"
            echo "$UPDATE_BUNDLE"
            echo
            echo "A/B update bundle SHA256:"
            echo "$UPDATE_SHA"
          } > BUILD-INFO.txt

          jq -n \
            --arg version "${{ inputs.vyos_version }}" \
            --arg vyos_commit "${{ steps.rootfs.outputs.vyos_commit }}" \
            --arg rpi_repo_commit "$REPO_COMMIT" \
            --arg frr "${{ steps.rootfs.outputs.frr_version }}" \
            --arg podman "${{ steps.rootfs.outputs.podman_version }}" \
            --arg vyos1x "${{ steps.rootfs.outputs.vyos1x_version }}" \
            --arg base_tag "${{ steps.base.outputs.tag }}" \
            --arg base_sha "${{ steps.base.outputs.sha256 }}" \
            --arg kernel "${{ steps.base.outputs.kernel }}" \
            --arg image "$IMAGE" \
            --arg image_sha "$IMAGE_SHA" \
            --arg update_bundle "$UPDATE_BUNDLE" \
            --arg update_sha "$UPDATE_SHA" \
            '{
              version: $version,
              architecture: "arm64",
              build_type: "release",
              vyos_build_commit: $vyos_commit,
              rpi_build_repo_commit: $rpi_repo_commit,
              frr_version: $frr,
              podman_version: $podman,
              vyos_1x_version: $vyos1x,
              hardware_base_tag: $base_tag,
              hardware_base_sha256: $base_sha,
              kernel: $kernel,
              image_layout: "raspberry-pi-ab",
              image: $image,
              image_sha256: $image_sha,
              update_bundle: $update_bundle,
              update_bundle_sha256: $update_sha
            }' > manifest.json

          cp "$PI5_BASE_MANIFEST" ./pi5-base-manifest.txt

          echo "===== SHA256SUMS ====="
          cat SHA256SUMS
          echo
          echo "===== BUILD INFO ====="
          cat BUILD-INFO.txt
          echo
          echo "===== OUTPUT ====="
          ls -lh \
            "$IMAGE" \
            "$UPDATE_BUNDLE" \
            SHA256SUMS \
            BUILD-INFO.txt \
            manifest.json \
            pi5-base-manifest.txt

      - name: Upload flashable Raspberry Pi VyOS image
        uses: actions/upload-artifact@v6
        with:
          name: vyos-pi5-image
          path: |
            output/vyos-${{ inputs.vyos_version }}-rpi-arm64.img.xz
            output/vyos-${{ inputs.vyos_version }}-rpi-arm64-update.tar.zst
            output/SHA256SUMS
            output/BUILD-INFO.txt
            output/manifest.json
            output/pi5-base-manifest.txt
            output/arm64-package-lock.tsv
            output/official-amd64-package-lock.tsv
            output/package-parity-report.txt
          retention-days: 7
          compression-level: 0
          if-no-files-found: error
