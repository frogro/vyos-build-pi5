name: Auto VyOS Raspberry Pi Nightly

on:
  schedule:
    - cron: '23 * * * *'

  workflow_dispatch:
    inputs:
      vyos_version:
        description: "Optional VyOS version override; empty = latest official rolling"
        required: false
        default: ""
        type: string
      force:
        description: "Build even if Raspberry Pi release already exists"
        required: false
        default: false
        type: boolean
      publish:
        description: "Publish result as GitHub pre-release"
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  actions: write

concurrency:
  group: auto-vyos-pi-nightly
  cancel-in-progress: false

jobs:
  auto-nightly:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Raspberry Pi repository
        uses: actions/checkout@v6
        with:
          ref: rolling
          fetch-depth: 0

      - name: Install verification tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            7zip \
            7zip-standalone \
            squashfs-tools \
            minisign \
            jq \
            xz-utils \
            zstd

      - name: Discover and verify official VyOS rolling release
        id: upstream
        shell: bash
        env:
          REQUESTED_VERSION: ${{ inputs.vyos_version }}
          FORCE_BUILD: ${{ inputs.force }}
          # Used only for release-existence checks in this repository.
          # Upstream VyOS discovery remains REST-free.
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # Use the official VyOS rolling pointer and signed release assets as the
          # source of truth.  Do not make unauthenticated api.github.com calls:
          # GitHub-hosted runners share public egress addresses and those REST
          # requests are subject to the small unauthenticated per-IP rate limit.
          curl --fail --location --retry 5 --retry-all-errors \
            https://raw.githubusercontent.com/vyos/vyos-nightly-build/rolling/version.json \
            -o upstream-pointer.json

          LATEST_VERSION="$(jq -r '.[0].version' upstream-pointer.json)"
          LATEST_ISO="$(jq -r '.[0].url' upstream-pointer.json)"
          LATEST_TIMESTAMP="$(jq -r '.[0].timestamp' upstream-pointer.json)"

          [[ "$LATEST_VERSION" =~ ^[0-9]{4}\.[0-9]{2}\.[0-9]{2}-[0-9]{4}-rolling$ ]]
          [[ "$LATEST_ISO" == https://github.com/vyos/vyos-nightly-build/releases/download/* ]]
          [[ "$LATEST_TIMESTAMP" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$ ]]

          if [ -n "${REQUESTED_VERSION:-}" ]; then
            VERSION="$REQUESTED_VERSION"
          else
            VERSION="$LATEST_VERSION"
          fi

          [[ "$VERSION" =~ ^[0-9]{4}\.[0-9]{2}\.[0-9]{2}-[0-9]{4}-rolling$ ]]

          if [ "$VERSION" = "$LATEST_VERSION" ]; then
            ISO_URL="$LATEST_ISO"
            UPSTREAM_PUBLISHED="$LATEST_TIMESTAMP"
          else
            ISO_URL="https://github.com/vyos/vyos-nightly-build/releases/download/${VERSION}/vyos-${VERSION}-generic-amd64.iso"
            DATE_PART="${VERSION%%-*}"
            TIME_PART="${VERSION#*-}"
            TIME_PART="${TIME_PART%-rolling}"
            UPSTREAM_PUBLISHED="${DATE_PART//./-}T${TIME_PART:0:2}:${TIME_PART:2:2}:00Z"
          fi

          SIG_URL="${ISO_URL}.minisig"
          UPSTREAM_NAME="$VERSION"
          UPSTREAM_URL="https://github.com/vyos/vyos-nightly-build/releases/tag/${VERSION}"

          cat > upstream-release-body.md <<EOF
          Official VyOS Rolling release: ${UPSTREAM_URL}

          The Raspberry Pi automation validates the official signed ISO directly.
          EOF

          TAG="v${VERSION}-rpi"

          if gh release view "$TAG" \
               --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
             && [ "${FORCE_BUILD:-false}" != "true" ]; then
            echo "Raspberry Pi release $TAG already exists; nothing to do."
            echo "should_build=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          curl --fail --location --retry 5 --retry-all-errors "$ISO_URL" -o upstream.iso
          curl --fail --location --retry 5 --retry-all-errors "$SIG_URL" -o upstream.iso.minisig
          curl --fail --location --retry 5 --retry-all-errors \
            https://raw.githubusercontent.com/vyos/vyos-nightly-build/rolling/minisign.pub \
            -o minisign.pub

          minisign -Vm upstream.iso -p minisign.pub

          mkdir -p upstream-iso
          7zz x upstream.iso \
            -oupstream-iso \
            live/filesystem.squashfs \
            -y

          FS=upstream-iso/live/filesystem.squashfs
          test -f "$FS"

          unsquashfs -cat "$FS" \
            usr/share/vyos/version.json \
            > upstream-vyos-version.json

          jq -e --arg v "$VERSION" '
            .version == $v
            and .architecture == "amd64"
            and (.build_git | length > 0)
          ' upstream-vyos-version.json

          BUILD_GIT="$(jq -r '.build_git' upstream-vyos-version.json)"
          BUILD_BRANCH="$(jq -r '.build_branch // ""' upstream-vyos-version.json)"

          [[ "$BUILD_GIT" =~ ^[0-9a-f]{7,40}$ ]]

          # The ISO normally records a full commit.  If an upstream build ever
          # records an abbreviated SHA, resolve it through the public Git smart
          # protocol instead of the GitHub REST API.
          if [[ "$BUILD_GIT" =~ ^[0-9a-f]{40}$ ]]; then
            VYOS_REF="$BUILD_GIT"
          else
            LOOKUP_REPO="$RUNNER_TEMP/vyos-build-commit-lookup"
            rm -rf "$LOOKUP_REPO"
            git init -q "$LOOKUP_REPO"
            git -C "$LOOKUP_REPO" remote add origin https://github.com/vyos/vyos-build.git

            LOOKUP_REF=""
            if [ -n "$BUILD_BRANCH" ] \
               && git ls-remote --exit-code --heads \
                    https://github.com/vyos/vyos-build.git \
                    "refs/heads/$BUILD_BRANCH" >/dev/null 2>&1; then
              LOOKUP_REF="refs/heads/$BUILD_BRANCH"
            else
              LOOKUP_REF="$(
                git ls-remote --symref https://github.com/vyos/vyos-build.git HEAD |
                awk '$1 == "ref:" {print $2; exit}'
              )"
            fi
            test -n "$LOOKUP_REF"

            git -C "$LOOKUP_REPO" fetch -q \
              --filter=blob:none \
              --no-tags \
              --depth=4096 \
              origin "$LOOKUP_REF"

            VYOS_REF="$(
              git -C "$LOOKUP_REPO" rev-parse "${BUILD_GIT}^{commit}" 2>/dev/null || true
            )"

            if [[ ! "$VYOS_REF" =~ ^[0-9a-f]{40}$ ]]; then
              git -C "$LOOKUP_REPO" fetch -q \
                --filter=blob:none \
                --no-tags \
                --deepen=16384 \
                origin "$LOOKUP_REF"
              VYOS_REF="$(
                git -C "$LOOKUP_REPO" rev-parse "${BUILD_GIT}^{commit}" 2>/dev/null || true
              )"
            fi
          fi

          [[ "$VYOS_REF" =~ ^[0-9a-f]{40}$ ]]
          [[ "$VYOS_REF" == "$BUILD_GIT"* ]]

          mkdir -p official-dpkg/updates

          unsquashfs -cat "$FS" \
            var/lib/dpkg/status \
            > official-dpkg/status

          FRR_VERSION="$(
            dpkg-query \
              --admindir="$PWD/official-dpkg" \
              -W -f='${Version}' frr
          )"

          PODMAN_VERSION="$(
            dpkg-query \
              --admindir="$PWD/official-dpkg" \
              -W -f='${Version}' podman
          )"

          VYOS1X_VERSION="$(
            dpkg-query \
              --admindir="$PWD/official-dpkg" \
              -W -f='${Version}' vyos-1x
          )"

          dpkg-query \
            --admindir="$PWD/official-dpkg" \
            -W -f='${Package}\t${Version}\t${Architecture}\n' | \
            LC_ALL=C sort -u > official-package-lock.tsv

          PACKAGE_LOCK_SHA256="$(sha256sum official-package-lock.tsv | awk '{print $1}')"
          PACKAGE_LOCK_COUNT="$(wc -l < official-package-lock.tsv | tr -d ' ')"

          echo "Official VyOS version: $VERSION"
          echo "Official build_git:    $BUILD_GIT"
          echo "Resolved full commit:  $VYOS_REF"
          echo "FRR:                   $FRR_VERSION"
          echo "Podman:                $PODMAN_VERSION"
          echo "vyos-1x:               $VYOS1X_VERSION"
          echo "Locked packages:       $PACKAGE_LOCK_COUNT"
          echo "Package lock SHA-256:  $PACKAGE_LOCK_SHA256"
          echo "Official ISO signature verification: PASS"
          echo "REST-free upstream discovery: PASS"

          {
            echo "should_build=true"
            echo "version=$VERSION"
            echo "vyos_ref=$VYOS_REF"
            echo "build_git=$BUILD_GIT"
            echo "frr_version=$FRR_VERSION"
            echo "podman_version=$PODMAN_VERSION"
            echo "vyos1x_version=$VYOS1X_VERSION"
            echo "package_lock_sha256=$PACKAGE_LOCK_SHA256"
            echo "package_lock_count=$PACKAGE_LOCK_COUNT"
            echo "upstream_name=$UPSTREAM_NAME"
            echo "upstream_published=$UPSTREAM_PUBLISHED"
            echo "upstream_release_url=$UPSTREAM_URL"
          } >> "$GITHUB_OUTPUT"

      - name: Upload official VyOS nightly package lock
        if: steps.upstream.outputs.should_build == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: vyos-nightly-lock-${{ github.run_id }}
          path: |
            official-package-lock.tsv
            upstream-vyos-version.json
          if-no-files-found: error
          retention-days: 30

      - name: Dispatch pinned Raspberry Pi build
        id: build
        if: steps.upstream.outputs.should_build == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.upstream.outputs.version }}
          VYOS_REF: ${{ steps.upstream.outputs.vyos_ref }}
          FRR_VERSION: ${{ steps.upstream.outputs.frr_version }}
          PODMAN_VERSION: ${{ steps.upstream.outputs.podman_version }}
          VYOS1X_VERSION: ${{ steps.upstream.outputs.vyos1x_version }}
          PACKAGE_LOCK_SHA256: ${{ steps.upstream.outputs.package_lock_sha256 }}
        run: |
          set -euo pipefail

          BEFORE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          TITLE="RPi $VERSION @ $VYOS_REF"

          gh workflow run build-vyos-pi5.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref rolling \
            -f vyos_ref="$VYOS_REF" \
            -f vyos_version="$VERSION" \
            -f expected_frr_version="$FRR_VERSION" \
            -f expected_podman_version="$PODMAN_VERSION" \
            -f expected_vyos1x_version="$VYOS1X_VERSION" \
            -f upstream_run_id="${{ github.run_id }}" \
            -f expected_package_lock_sha256="$PACKAGE_LOCK_SHA256"

          RUN_ID=""

          for _ in $(seq 1 60); do
            RUN_ID="$(
              gh run list \
                --repo "$GITHUB_REPOSITORY" \
                --workflow build-vyos-pi5.yml \
                --branch rolling \
                --event workflow_dispatch \
                --limit 20 \
                --json databaseId,displayTitle,createdAt |
              jq -r \
                --arg title "$TITLE" \
                --arg before "$BEFORE" \
                '.[] |
                 select(.displayTitle == $title and .createdAt >= $before) |
                 .databaseId' |
              head -n1
            )"

            [ -n "$RUN_ID" ] && break
            sleep 5
          done

          test -n "$RUN_ID"

          echo "Child build run: $RUN_ID"

          gh run watch "$RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --exit-status

          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"

          mkdir -p artifact

          gh run download "$RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name vyos-pi5-image \
            --dir artifact

      - name: Validate generated Raspberry Pi artifact
        if: steps.upstream.outputs.should_build == 'true'
        shell: bash
        env:
          VERSION: ${{ steps.upstream.outputs.version }}
          VYOS_REF: ${{ steps.upstream.outputs.vyos_ref }}
          FRR_VERSION: ${{ steps.upstream.outputs.frr_version }}
          PODMAN_VERSION: ${{ steps.upstream.outputs.podman_version }}
          VYOS1X_VERSION: ${{ steps.upstream.outputs.vyos1x_version }}
        run: |
          set -euo pipefail

          cd artifact

          sha256sum -c SHA256SUMS

          IMAGE="vyos-${VERSION}-rpi-arm64.img.xz"
          UPDATE="vyos-${VERSION}-rpi-arm64-update.tar.zst"
          UPDATE_MANIFEST="$RUNNER_TEMP/rpi-ab-update-manifest.json"

          test -f "$IMAGE"
          test -f "$UPDATE"
          xz -t "$IMAGE"
          zstd -q -t "$UPDATE"

          zstd -q -dc "$UPDATE" | tar -xOf - manifest.json > "$UPDATE_MANIFEST"

          jq -e \
            --arg version "$VERSION" \
            --arg ref "$VYOS_REF" \
            --arg frr "$FRR_VERSION" \
            --arg podman "$PODMAN_VERSION" \
            --arg vyos1x "$VYOS1X_VERSION" \
            --arg image "$IMAGE" \
            --arg update "$UPDATE" '
              .version == $version
              and .architecture == "arm64"
              and .build_type == "release"
              and .vyos_build_commit == $ref
              and .frr_version == $frr
              and .podman_version == $podman
              and .vyos_1x_version == $vyos1x
              and .image_layout == "raspberry-pi-ab"
              and .image == $image
              and .update_bundle == $update
            ' manifest.json

          jq -e \
            --arg version "$VERSION" '
              .format == "vyos-rpi-ab-update"
              and .format_version == 2
              and .platform == "raspberry-pi"
              and .architecture == "arm64"
              and .version == $version
              and .required_layout.control_label == "VYOS_AB"
              and .required_layout.boot_labels.A == "VYOS_BOOT_A"
              and .required_layout.boot_labels.B == "VYOS_BOOT_B"
              and .required_layout.root_labels.A == "VYOS_ROOT_A"
              and .required_layout.root_labels.B == "VYOS_ROOT_B"
              and .required_layout.boot_partitions.A == 2
              and .required_layout.boot_partitions.B == 3
              and .required_layout.root_partitions.A == 5
              and .required_layout.root_partitions.B == 6
            ' "$UPDATE_MANIFEST"

          echo "Complete automated Raspberry Pi A/B artifact QA: PASS"

      - name: Publish automated Raspberry Pi release
        if: ${{ github.ref == 'refs/heads/rolling' && steps.upstream.outputs.should_build == 'true' && (github.event_name == 'schedule' || inputs.publish) }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.upstream.outputs.version }}
          VYOS_REF: ${{ steps.upstream.outputs.vyos_ref }}
          FRR_VERSION: ${{ steps.upstream.outputs.frr_version }}
          PODMAN_VERSION: ${{ steps.upstream.outputs.podman_version }}
          VYOS1X_VERSION: ${{ steps.upstream.outputs.vyos1x_version }}
          UPSTREAM_NAME: ${{ steps.upstream.outputs.upstream_name }}
          UPSTREAM_PUBLISHED: ${{ steps.upstream.outputs.upstream_published }}
          UPSTREAM_URL: ${{ steps.upstream.outputs.upstream_release_url }}
        run: |
          set -euo pipefail

          TAG="v${VERSION}-rpi"

          if gh release view "$TAG" \
               --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists; refusing to overwrite it."
            exit 1
          fi

          KERNEL="$(jq -r '.kernel' artifact/manifest.json)"
          BASE_TAG="$(jq -r '.hardware_base_tag' artifact/manifest.json)"
          RPI_COMMIT="$(jq -r '.rpi_build_repo_commit' artifact/manifest.json)"

          python3 scripts/pi5/render-release-notes.py \
            --version "$VERSION" \
            --upstream-name "$UPSTREAM_NAME" \
            --upstream-published "$UPSTREAM_PUBLISHED" \
            --upstream-url "$UPSTREAM_URL" \
            --vyos-ref "$VYOS_REF" \
            --frr-version "$FRR_VERSION" \
            --podman-version "$PODMAN_VERSION" \
            --vyos1x-version "$VYOS1X_VERSION" \
            --kernel "$KERNEL" \
            --base-tag "$BASE_TAG" \
            --upstream-notes-file upstream-release-body.md \
            --output RELEASE-NOTES.md

          gh release create "$TAG" \
            artifact/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$RPI_COMMIT" \
            --title "VyOS ${VERSION} for Raspberry Pi 4 / 5" \
            --notes-file RELEASE-NOTES.md \
            --latest

      - name: Update project changelog and latest A/B metadata
        if: ${{ github.ref == 'refs/heads/rolling' && steps.upstream.outputs.should_build == 'true' && (github.event_name == 'schedule' || inputs.publish) }}
        shell: bash
        env:
          VERSION: ${{ steps.upstream.outputs.version }}
          VYOS_REF: ${{ steps.upstream.outputs.vyos_ref }}
          FRR_VERSION: ${{ steps.upstream.outputs.frr_version }}
          PODMAN_VERSION: ${{ steps.upstream.outputs.podman_version }}
          VYOS1X_VERSION: ${{ steps.upstream.outputs.vyos1x_version }}
          UPSTREAM_URL: ${{ steps.upstream.outputs.upstream_release_url }}
          UPSTREAM_PUBLISHED: ${{ steps.upstream.outputs.upstream_published }}
        run: |
          set -euo pipefail

          git pull --rebase origin rolling

          KERNEL="$(jq -r '.kernel' artifact/manifest.json)"
          BASE_TAG="$(jq -r '.hardware_base_tag' artifact/manifest.json)"

          python3 scripts/pi5/update-changelog.py \
            --file CHANGELOG.md \
            --version "$VERSION" \
            --upstream-url "$UPSTREAM_URL" \
            --vyos-ref "$VYOS_REF" \
            --frr-version "$FRR_VERSION" \
            --podman-version "$PODMAN_VERSION" \
            --vyos1x-version "$VYOS1X_VERSION" \
            --kernel "$KERNEL" \
            --base-tag "$BASE_TAG"

          python3 scripts/pi5/write-version-json.py \
            --version "$VERSION" \
            --timestamp "$UPSTREAM_PUBLISHED" \
            --repository "$GITHUB_REPOSITORY" \
            --output version.json

          if git diff --quiet -- CHANGELOG.md version.json; then
            echo "Changelog and version.json already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add CHANGELOG.md version.json
          git diff --cached --check
          git commit -m "Document automated VyOS ${VERSION} Raspberry Pi A/B build"

          git push origin HEAD:rolling
